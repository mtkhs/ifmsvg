[render]
; ラスタ化解像度 (DPI)。範囲外は無視してデフォルトに戻す。
; 既定 150、許容 30〜1200。
dpi=150

; 背景処理。colored または transparent。既定 colored。
background=colored

; background=colored の塗り色。RRGGBB の 16進。既定 FFFFFF。
background_color=FFFFFF

; ピクセル寸法の上限 (各辺)。0 で無効。既定 8192。
max_size=8192

[font]
; Windows システムフォントを読み込むか。既定 true。
load_system_fonts=true

; font-family が解決できなかった場合のフォールバック。既定 Arial。
default_family=Arial

; 追加で読み込むフォントディレクトリ。セミコロン区切り。既定なし。
extra_dirs=
